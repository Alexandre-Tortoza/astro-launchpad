name: Feature request
description: Propose a user problem worth solving.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the desired behavior and relevant alternatives.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
