name: Release (manual)

# Triggered by manually pushing a version tag, e.g. for hotfixes.
# Normal releases happen automatically via auto-release.yml on main push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit
      - name: Verify tag version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const { version } = require('./packages/create-astro-launchpad/package.json'); if (process.env.TAG !== 'v' + version) throw new Error('Tag and package version must match.');"
      - name: Pack the release artifact
        working-directory: packages/create-astro-launchpad
        run: npm pack
      - name: Smoke test the packed CLI
        working-directory: packages/create-astro-launchpad
        run: npm install --global ./create-astro-launchpad-*.tgz && create-astro-launchpad --version && create-astro-launchpad --help
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Publish the tested artifact
        working-directory: packages/create-astro-launchpad
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./create-astro-launchpad-*.tgz --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "${TAG#v}" "$RUNNER_TEMP/release-notes.md" && gh release create "$TAG" packages/create-astro-launchpad/create-astro-launchpad-*.tgz --notes-file "$RUNNER_TEMP/release-notes.md"
